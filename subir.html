<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Víctor & Flor - Compartir Fotos y Chat</title>
    
    <!-- Tipografías elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&family=Alex+Brush&display=swap" rel="stylesheet">
    
    <!-- SDK de Cloudinary -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    
    <!-- SDK de Firebase (Chat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #f7f5f0;
            color: #333333;
            text-align: center;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 0 25px rgba(0,0,0,0.08);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ENCABEZADO CON LA FOTO DE LA INVITACIÓN */
        .hero-header {
            position: relative;
            height: 220px;
            background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)), url('foto_pareja.jpg');
            background-position: center 30%;
            background-size: cover;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 15px;
            border-bottom: 2px solid #bfa15f;
        }
        .hero-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            letter-spacing: 3px;
            font-weight: 400;
            text-transform: uppercase;
            color: #ffffff;
        }
        .hero-header .ampersand {
            font-family: 'Alex Brush', cursive;
            font-size: 2.8rem;
            color: #f3ece0;
            margin: -10px 0;
            display: block;
        }
        .hero-header p {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e5dfd3;
            margin-top: 5px;
        }

        /* CONTENEDOR PRINCIPAL ESTILO APP */
        .content-wrapper {
            background-color: #121212;
            color: #ffffff;
            flex: 1;
            padding: 20px 15px 40px 15px;
            text-align: left;
        }

        /* CARD PARA CÁMARA */
        .upload-card {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 18px;
            padding: 20px 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .upload-card h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: #bfa15f;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .upload-card p {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            color: #aaaaaa;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .btn-upload-main {
            background: linear-gradient(135deg, #c3a462, #9a8553);
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 6px 20px rgba(195, 164, 98, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            width: 100%;
            justify-content: center;
        }

        /* SECCIÓN DE CHAT PERMANENTE */
        .chat-section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            padding-left: 5px;
        }
        .chat-box {
            background: #1e1e1e;
            border-radius: 18px;
            height: 320px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            border: 1px solid #2a2a2a;
            font-family: 'Montserrat', sans-serif;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background: #2a2a2a;
            padding: 10px 14px;
            border-radius: 14px;
            max-width: 88%;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #dddddd;
        }
        .message .user {
            font-weight: 600;
            font-size: 0.7rem;
            color: #bfa15f;
            margin-bottom: 2px;
        }
        .chat-input {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .chat-input input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            padding: 12px 16px;
            border-radius: 22px;
            color: #fff;
            outline: none;
            font-size: 0.8rem;
            font-family: 'Montserrat', sans-serif;
        }
        .chat-input button {
            background: #bfa15f;
            border: none;
            color: #ffffff;
            padding: 0 18px;
            border-radius: 22px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO CON LA FOTO DE LA INVITACIÓN -->
    <div class="hero-header">
        <h1>Víctor Miguel</h1>
        <span class="ampersand">&</span>
        <h1>Flor de Liz</h1>
        <p>12 de Diciembre de 2026 • Orizaba, Ver.</p>
    </div>

    <!-- CONTENIDO TIPO APP -->
    <div class="content-wrapper">
        
        <!-- CÁMARA / SUBIDA DE FOTOS -->
        <div class="upload-card">
            <h2>📷 Álbum Digital de Bodas</h2>
            <p>Toma una foto o video para guardarlo permanentemente en nuestro álbum de bodas.</p>
            <button class="btn-upload-main" onclick="openCloudinaryWidget()">
                📷 Abrir Cámara / Galería
            </button>
        </div>

        <!-- CHAT PERMANENTE -->
        <div class="chat-section-title">💬 Felicitaciones & Chat</div>
        <div class="chat-box">
            <div class="chat-messages" id="chat-messages">
                <div class="message">
                    <div class="user">Flor & Víctor</div>
                    ¡Gracias por acompañarnos! Déjanos tu mensaje aquí ❤️
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="msg-input" placeholder="Escribe un mensaje...">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>

    </div>

    <script>
        // CONFIGURACIÓN CLOUDINARY (pheewujq)
        function openCloudinaryWidget() {
            cloudinary.openUploadWidget({
                cloudName: 'pheewujq',
                uploadPreset: 'ml_default',
                sources: ['camera', 'local'],
                multiple: true,
                maxFiles: 10,
                styles: {
                    palette: {
                        window: "#121212",
                        sourceBg: "#1e1e1e",
                        windowBorder: "#bfa15f",
                        tabIcon: "#ffffff",
                        inactiveTabIcon: "#888888",
                        menuIcons: "#bfa15f",
                        link: "#bfa15f",
                        action: "#bfa15f",
                        textDark: "#000000",
                        textLight: "#ffffff"
                    }
                }
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    alert("¡Muchas gracias! Tu foto se guardó con éxito.");
                }
            });
        }

        // SISTEMA DE CHAT PERMANENTE (Persistencia con LocalStorage + Firebase)
        const chatContainer = document.getElementById('chat-messages');

        function appendMessage(user, message) {
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.innerHTML = `<div class="user">${user}</div>${message}`;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Cargar mensajes guardados previamente
        function loadSavedMessages() {
            const saved = localStorage.getItem('chat_boda_messages');
            if (saved) {
                const messages = JSON.parse(saved);
                messages.forEach(m => appendMessage(m.user, m.message));
            }
        }

        // Guardar nuevo mensaje permanente
        window.sendMessage = function() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            
            if (text !== "") {
                appendMessage("Invitado", text);

                // Guardar en almacenamiento local para no perder nada al recargar
                let saved = JSON.parse(localStorage.getItem('chat_boda_messages') || "[]");
                saved.push({ user: "Invitado", message: text });
                localStorage.setItem('chat_boda_messages', JSON.stringify(saved));

                // Intento opcional de sincronización con Firebase Realtime Database
                if (typeof firebase !== 'undefined' && firebase.apps.length) {
                    firebase.database().ref("chat_boda").push({
                        user: "Invitado",
                        message: text,
                        timestamp: Date.now()
                    });
                }

                input.value = "";
            }
        };

        // Cargar historial al iniciar
        window.onload = function() {
            loadSavedMessages();
            setTimeout(openCloudinaryWidget, 600);
        };
    </script>
</body>
</html>
