<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Botón flotante para la música */
    .music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.2s ease;
    }

    .music-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Audio apuntando a novatos.mp3 -->
  <audio id="bg-music" src="novatos.mp3" loop></audio>

  <!-- Botón flotante de control de música -->
  <button class="music-btn" id="music-toggle" onclick="toggleMusic()">
    🎵
  </button>

  <script>
    const audio = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-toggle');

    function toggleMusic() {
      if (audio.paused) {
        audio.play();
        musicBtn.textContent = '⏸️';
      } else {
        audio.pause();
        musicBtn.textContent = '🎵';
      }
    }
  </script>

</body>
</html>
