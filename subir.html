<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartir Foto - Víctor & Flor</title>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h2 { font-weight: 400; margin-bottom: 8px; color: #bfa15f; }
        p { font-size: 0.9rem; opacity: 0.8; margin-bottom: 30px; line-height: 1.5; }
        .btn-upload {
            background: linear-gradient(135deg, #c3a462, #9a8553);
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h2>📷 Álbum Digital de Bodas</h2>
    <p><b>Víctor Miguel & Flor de Liz</b><br>Toma una foto o video para guardarlo en nuestro álbum de bodas ❤️</p>
    
    <button class="btn-upload" onclick="openWidget()">📷 Abrir Cámara / Galería</button>

    <script>
        function openWidget() {
            cloudinary.openUploadWidget({
                cloudName: 'pheewujq',
                uploadPreset: 'ml_default',
                sources: ['camera', 'local'],
                multiple: true,
                maxFiles: 10,
                styles: {
                    palette: {
                        window: "#121212",
                        sourceBg: "#1e1e1e",
                        windowBorder: "#bfa15f",
                        tabIcon: "#ffffff",
                        inactiveTabIcon: "#888888",
                        menuIcons: "#bfa15f",
                        link: "#bfa15f",
                        action: "#bfa15f",
                        textDark: "#000000",
                        textLight: "#ffffff"
                    }
                }
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    alert("¡Muchas gracias! Tu foto ya se guardó en nuestro álbum.");
                }
            });
        }

        // Abre el selector de cámara automáticamente al escanear el QR
        window.onload = openWidget;
    </script>
</body>
</html>
