<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Víctor & Flor de Liz - Boda</title>
    
    <!-- Tipografías elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Librerías CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    
    <!-- SDK Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html {
            background-color: #eaf0ea;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #eaf0ea url('fondo.jpg') center top / cover no-repeat fixed;
            color: #2c352b;
            text-align: left;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 16px 16px 100px 16px;
            box-shadow: 0 0 40px rgba(0,0,0,0.15);
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 0;
            pointer-events: none;
        }

        .event-card-app {
            position: relative;
            height: 250px;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, rgba(20, 30, 20, 0.8) 100%), 
                        #4a5a48 url('foto_pareja.jpg') center 30%/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(44, 53, 43, 0.15);
            margin-bottom: 22px;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .badge-premium {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            border: 1px solid rgba(138, 163, 134, 0.3);
            color: #3b493a;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-premium::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #7a9a76;
            border-radius: 50%;
            box-shadow: 0 0 6px #7a9a76;
        }

        .event-card-app h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.3rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.05;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .event-card-app p {
            font-size: 0.82rem;
            font-weight: 500;
            color: #f0f4f0;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .app-actions {
            display: flex;
            justify-content: space-around;
            padding: 8px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(138, 163, 134, 0.25);
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: #637562;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            flex: 1;
            padding: 8px 0;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 18px;
        }

        .action-icon {
            width: 48px;
            height: 48px;
            background: #edf2ed;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(138, 163, 134, 0.2);
        }

        .action-btn.active {
            color: #2c352b;
            font-weight: 700;
        }

        .action-btn.active .action-icon {
            background: linear-gradient(135deg, #a4be9e 0%, #7e9d77 100%);
            color: #ffffff;
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 8px 18px rgba(126, 157, 119, 0.35);
        }

        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
            position: relative;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .music-player-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1500;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(138, 163, 134, 0.4);
            border-radius: 30px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-size: 0.75rem;
            font-weight: 600;
            color: #3b493a;
            transition: transform 0.2s ease;
        }

        .music-player-btn:active {
            transform: scale(0.95);
        }

        .music-icon {
            font-size: 1rem;
            animation: spin 4s linear infinite;
            animation-play-state: paused;
        }

        .music-player-btn.playing .music-icon {
            animation-play-state: running;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .photos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
            gap: 8px;
        }

        .photos-count {
            font-size: 0.82rem;
            color: #4a5a48;
            font-weight: 600;
        }

        .photos-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sort-select {
            background: rgba(255, 255, 255, 0.95);
            color: #2c352b;
            border: 1px solid rgba(138, 163, 134, 0.4);
            padding: 8px 10px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            cursor: pointer;
        }

        .clear-btn {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.25);
            color: #d32f2f;
            padding: 8px 10px;
            border-radius: 14px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .photo-item img, .photo-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .time-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.68rem;
            font-weight: 600;
            color: #2c352b;
            z-index: 2;
            border: 1px solid rgba(138, 163, 134, 0.2);
        }

        .like-btn {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(138, 163, 134, 0.2);
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 0.72rem;
            color: #2c352b;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 3;
            cursor: pointer;
            font-weight: 600;
        }

        .timeline-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(138, 163, 134, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .timeline-time {
            font-size: 0.95rem;
            font-weight: 700;
            color: #557053;
            min-width: 85px;
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            height: 520px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(138, 163, 134, 0.25);
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        .chat-header {
            padding: 12px 16px;
            background: rgba(240, 245, 240, 0.95);
            border-bottom: 1px solid rgba(138, 163, 134, 0.2);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-user-settings {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-select {
            background: #ffffff;
            color: #2c352b;
            border: 1px solid rgba(138, 163, 134, 0.4);
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            cursor: pointer;
        }

        .name-badge {
            background: rgba(138, 163, 134, 0.15);
            border: 1px solid rgba(138, 163, 134, 0.3);
            color: #3b493a;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-msg-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            max-width: 85%;
            position: relative;
        }

        .chat-msg-row.other { align-self: flex-start; }
        .chat-msg-row.me { align-self: flex-end; flex-direction: row-reverse; }

        .chat-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a4be9e 0%, #7e9d77 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .chat-msg-row.me .chat-avatar {
            background: linear-gradient(135deg, #557053 0%, #3b493a 100%);
            color: #ffffff;
        }

        .chat-msg-row.novios .chat-avatar {
            background: linear-gradient(135deg, #cde0ca 0%, #8fa18e 100%);
            color: #1c261b;
            box-shadow: 0 0 8px rgba(138, 163, 134, 0.5);
        }

        .chat-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.83rem;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
        }

        .chat-msg-row.other .chat-bubble {
            background: #f0f4f0;
            color: #2c352b;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(138, 163, 134, 0.15);
        }

        .chat-msg-row.me .chat-bubble {
            background: linear-gradient(135deg, #a4be9e 0%, #7e9d77 100%);
            color: #ffffff;
            font-weight: 500;
            border-bottom-right-radius: 4px;
        }

        .chat-msg-row.novios .chat-bubble {
            background: #233022;
            color: #ffffff;
            border: 1px solid #a4be9e;
        }

        .chat-author {
            font-size: 0.68rem;
            font-weight: 700;
            margin-bottom: 2px;
            color: #4a5a48;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-msg-row.me .chat-author { color: #f0f4f0; }
        .chat-msg-row.novios .chat-author { color: #cde0ca; }

        .role-tag {
            font-size: 0.6rem;
            background: rgba(0, 0, 0, 0.08);
            padding: 1px 5px;
            border-radius: 6px;
            font-weight: 500;
        }

        .chat-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            font-size: 0.62rem;
            margin-top: 4px;
            opacity: 0.8;
        }

        .delete-msg-icon {
            cursor: pointer;
            color: #d32f2f;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .chat-input-area {
            padding: 12px 14px;
            background: rgba(240, 245, 240, 0.95);
            border-top: 1px solid rgba(138, 163, 134, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background: #ffffff;
            border: 1px solid rgba(138, 163, 134, 0.3);
            padding: 12px 16px;
            border-radius: 20px;
            color: #2c352b;
            outline: none;
            font-size: 0.85rem;
            font-family: 'Montserrat', sans-serif;
        }

        .chat-send-btn {
            background: linear-gradient(135deg, #a4be9e 0%, #7e9d77 100%);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(126, 157, 119, 0.3);
        }

        .chat-send-btn svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }

        .upload-btn-container {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        .upload-btn-main {
            pointer-events: auto;
            background: linear-gradient(135deg, #9bb895 0%, #71936a 100%);
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            border-radius: 35px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(113, 147, 106, 0.4);
            cursor: pointer;
        }

        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 20, 15, 0.92);
            backdrop-filter: blur(15px);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox-modal.active { display: flex; }

        .lightbox-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-content {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 20px;
            object-fit: contain;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .nav-btn.prev { left: -10px; }
        .nav-btn.next { right: -10px; }

        .lightbox-actions {
            margin-top: 18px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .lightbox-delete-btn {
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.5);
            color: #ff453a;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .lightbox-close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR DE MÚSICA -->
    <button class="music-player-btn" id="music-toggle" onclick="toggleMusic()">
        <span class="music-icon">🎵</span>
        <span id="music-text">Música</span>
    </button>
    <audio id="bg-music" src="cancion.mp3" loop></audio>

    <div class="event-card-app">
        <span class="badge-premium">Álbum Boda</span>
        <h3>Víctor & Flor de Liz</h3>
        <p>📍 Orizaba, Ver.</p>
    </div>

    <div class="app-actions">
        <button class="action-btn active" onclick="switchTab('fotos', this)">
            <div class="action-icon">🖼</div>
            Fotos
        </button>
        <button class="action-btn" onclick="switchTab('planning', this)">
            <div class="action-icon">📋</div>
            Planning
        </button>
        <button class="action-btn" onclick="switchTab('chat', this)">
            <div class="action-icon">💬</div>
            Chat
        </button>
    </div>

    <!-- PESTAÑA GALERÍA DE FOTOS -->
    <div id="tab-fotos" class="tab-content active">
        <div class="photos-header">
            <span class="photos-count" id="photos-count">0 archivos</span>
            <div class="photos-controls">
                <select class="sort-select" id="sort-select" onchange="renderGallery()">
                    <option value="newest">⚡ Recientes</option>
                    <option value="oldest">⏳ Antiguas</option>
                </select>
                <button class="clear-btn" onclick="borrarTodasLasFotos()">🗑️ Limpiar</button>
            </div>
        </div>
        <div class="photo-grid" id="gallery"></div>
    </div>

    <!-- PESTAÑA PLANNING -->
    <div id="tab-planning" class="tab-content">
        <div class="timeline-item">
            <div class="timeline-time">16:00 h</div>
            <div>
                <h4>Ceremonia Civil</h4>
                <p style="font-size: 0.8rem; opacity:0.75;">Jardín de las Orquídeas</p>
            </div>
        </div>
        <div class="timeline-item">
            <div class="timeline-time">18:00 h</div>
            <div>
                <h4>Recepción</h4>
                <p style="font-size: 0.8rem; opacity:0.75;">Jardín Central</p>
            </div>
        </div>
    </div>

    <!-- PESTAÑA CHAT -->
    <div id="tab-chat" class="tab-content">
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-top">
                    <span style="font-size: 0.78rem; color: #4a5a48; font-weight: 600;">Perfil de Chat:</span>
                    <span style="font-size: 0.7rem; color: #557053; display: flex; align-items: center; gap: 4px; font-weight:600;">
                        <span style="width: 6px; height: 6px; background:#557053; border-radius:50%;"></span> En vivo
                    </span>
                </div>
                <div class="chat-user-settings">
                    <button class="name-badge" id="current-user-badge" onclick="cambiarNombre()">Invitado ✏️</button>
                    <select class="role-select" id="role-select" onchange="guardarRol()">
                        <option value="Invitado">👥 Invitado</option>
                        <option value="Novio (Víctor)">🤵 Novio (Víctor)</option>
                        <option value="Novia (Flor de Liz)">👰 Novia (Flor de Liz)</option>
                        <option value="Familia">❤️ Familia</option>
                        <option value="Dama de Honor">🌸 Dama de Honor</option>
                    </select>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages"></div>

            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Escribe un mensaje para los novios..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="chat-send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="upload-btn-container" id="upload-btn-container">
        <button class="upload-btn-main" onclick="openCloudinaryWidget()">📸 Subir Foto o Video</button>
    </div>

    <!-- MODAL VISOR EN CARRUSEL -->
    <div class="lightbox-modal" id="lightbox">
        <div class="lightbox-container">
            <button class="nav-btn prev" onclick="navigateCarousel(-1)">❮</button>
            <div id="lightbox-body" style="display:flex; justify-content:center; width: 100%;"></div>
            <button class="nav-btn next" onclick="navigateCarousel(1)">❯</button>
        </div>
        <div class="lightbox-actions">
            <button class="lightbox-delete-btn" id="lightbox-delete-btn">🗑 Eliminar</button>
            <button class="lightbox-close-btn" onclick="closeLightbox()">Cerrar</button>
        </div>
    </div>

    <script>
        const CONTRASEÑA_ADMIN = "1234";

        /* --- CONTROL DE MÚSICA --- */
        const audio = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-toggle');
        const musicText = document.getElementById('music-text');

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                musicBtn.classList.add('playing');
                musicText.textContent = 'Pausa';
            } else {
                audio.pause();
                musicBtn.classList.remove('playing');
                musicText.textContent = 'Música';
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDUiIw6yisQ0u7Re06HPXroBIigiTr6Nvo",
            authDomain: "boda-victor-flor.firebaseapp.com",
            databaseURL: "https://boda-victor-flor-default-rtdb.firebaseio.com",
            projectId: "boda-victor-flor",
            storageBucket: "boda-victor-flor.firebasestorage.app",
            messagingSenderId: "461181016128",
            appId: "1:461181016128:web:36c3fa9307e1fc7d88e7a5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let myName = localStorage.getItem('chat_username') || '';
        let myRole = localStorage.getItem('chat_userrole') || 'Invitado';

        if (!myName) {
            myName = 'Invitado ' + Math.floor(100 + Math.random() * 900);
            localStorage.setItem('chat_username', myName);
        }
        document.getElementById('current-user-badge').textContent = myName + ' ✏️';
        document.getElementById('role-select').value = myRole;

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            btn.classList.add('active');

            const uploadContainer = document.getElementById('upload-btn-container');
            if (tabName === 'fotos') {
                uploadContainer.style.display = 'flex';
            } else {
                uploadContainer.style.display = 'none';
            }
        }

        function cambiarNombre() {
            const nuevo = prompt("Introduce tu nombre:", myName);
            if (nuevo && nuevo.trim() !== '') {
                myName = nuevo.trim();
                localStorage.setItem('chat_username', myName);
                document.getElementById('current-user-badge').textContent = myName + ' ✏️';
            }
        }

        function guardarRol() {
            const select = document.getElementById('role-select');
            myRole = select.value;
            
            if (myRole.includes('Novio') || myRole.includes('Novia')) {
                const pass = prompt("Para identificarte como Novio/Novia ingresa la clave:");
                if (pass !== CONTRASEÑA_ADMIN) {
                    alert("Clave incorrecta. Se mantendrá como Invitado.");
                    myRole = 'Invitado';
                    select.value = 'Invitado';
                }
            }
            localStorage.setItem('chat_userrole', myRole);
        }

        /* --- LÓGICA DE FOTOS Y GALERÍA --- */
        let galleryItems = [];
        let sortedItems = [];
        let currentIndex = 0;

        db.ref("galeria_boda").on("value", (snapshot) => {
            const data = snapshot.val();
            galleryItems = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    galleryItems.push({ id: key, ...data[key] });
                });
            }
            renderGallery();
        });

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const sortOrder = document.getElementById('sort-select').value;
            const countLabel = document.getElementById('photos-count');

            sortedItems = [...galleryItems].sort((a, b) => {
                return sortOrder === 'newest' ? b.timestamp - a.timestamp : a.timestamp - b.timestamp;
            });

            countLabel.textContent = `${sortedItems.length} archivos`;
            gallery.innerHTML = '';

            sortedItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'photo-item';

                const timeTag = `<span class="time-tag">⏱ ${item.timeStr || ''}</span>`;
                const likeBtn = `<div class="like-btn" onclick="toggleLike(event, '${item.id}')">❤️ ${item.likes || 0}</div>`;

                if (item.type === 'video') {
                    card.innerHTML = `${timeTag}<video src="${item.url}#t=0.5" preload="metadata"></video>${likeBtn}`;
                } else {
                    card.innerHTML = `${timeTag}<img src="${item.url}" loading="lazy">${likeBtn}`;
                }

                card.onclick = (e) => {
                    if (!e.target.closest('.like-btn')) openCarousel(index);
                };

                gallery.appendChild(card);
            });
        }

        function toggleLike(e, itemId) {
            e.stopPropagation();
            db.ref(`galeria_boda/${itemId}/likes`).transaction(current => (current || 0) + 1);
        }

        function openCloudinaryWidget() {
            cloudinary.openUploadWidget({
                cloudName: 'a1tokqak',
                uploadPreset: 'ml_default',
                sources: ['local', 'camera'],
                multiple: true
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    const now = new Date();
                    const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} h`;

                    db.ref("galeria_boda").push({
                        url: result.info.secure_url,
                        type: result.info.resource_type === 'video' ? 'video' : 'image',
                        timeStr: timeStr,
                        timestamp: Date.now(),
                        likes: 0
                    }).then(() => {
                        if (typeof confetti === 'function') confetti();
                    });
                }
            });
        }

        function openCarousel(index) {
            currentIndex = index;
            updateCarouselContent();
            document.getElementById('lightbox').classList.add('active');
        }

        function updateCarouselContent() {
            const body = document.getElementById('lightbox-body');
            const deleteBtn = document.getElementById('lightbox-delete-btn');
            const item = sortedItems[currentIndex];

            if (!item) return;

            if (item.type === 'video') {
                body.innerHTML = `<video class="lightbox-content" src="${item.url}" controls autoplay></video>`;
            } else {
                body.innerHTML = `<img class="lightbox-content" src="${item.url}" alt="Foto boda">`;
            }

            deleteBtn.onclick = () => borrarFoto(item.id);
        }

        function navigateCarousel(step) {
            if (sortedItems.length === 0) return;
            currentIndex = (currentIndex + step + sortedItems.length) % sortedItems.length;
            updateCarouselContent();
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lightbox-body').innerHTML = '';
        }

        function borrarFoto(id) {
            const pass = prompt("Para eliminar esta foto ingresa la clave admin:");
            if (pass === CONTRASEÑA_ADMIN) {
                db.ref(`galeria_boda/${id}`).remove().then(() => {
                    closeLightbox();
                });
            } else if (pass !== null) {
                alert("Clave incorrecta.");
            }
        }

        function borrarTodasLasFotos() {
            const pass = prompt("¿Seguro que deseas borrar TODAS las fotos? Ingresa la clave:");
            if (pass === CONTRASEÑA_ADMIN) {
                db.ref("galeria_boda").remove();
            } else if (pass !== null) {
                alert("Clave incorrecta.");
            }
        }

        /* --- LÓGICA DE CHAT EN VIVO --- */
        db.ref("chat_boda").on("value", (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';

            if (data) {
                Object.keys(data).forEach(key => {
                    const msg = data[key];
                    const isMe = msg.name === myName;
                    const isNovios = msg.role && (msg.role.includes('Novio') || msg.role.includes('Novia'));

                    let rowClass = 'chat-msg-row ';
                    if (isNovios) rowClass += 'novios ';
                    else if (isMe) rowClass += 'me ';
                    else rowClass += 'other ';

                    const initial = (msg.name || 'I').charAt(0).toUpperCase();

                    const msgDiv = document.createElement('div');
                    msgDiv.className = rowClass;

                    msgDiv.innerHTML = `
                        <div class="chat-avatar">${initial}</div>
                        <div class="chat-bubble">
                            <div class="chat-author">
                                ${msg.name} 
                                <span class="role-tag">${msg.role || 'Invitado'}</span>
                            </div>
                            <div>${msg.text}</div>
                            <div class="chat-meta">
                                <span>${msg.timeStr || ''}</span>
                                <span class="delete-msg-icon" onclick="borrarMensaje('${key}')">×</span>
                            </div>
                        </div>
                    `;

                    container.appendChild(msgDiv);
                });
                container.scrollTop = container.scrollHeight;
            }
        });

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();

            if (text !== '') {
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} h`;

                db.ref("chat_boda").push({
                    name: myName,
                    role: myRole,
                    text: text,
                    timeStr: timeStr,
                    timestamp: Date.now()
                });

                input.value = '';
            }
        }

        function borrarMensaje(key) {
            const pass = prompt("Para eliminar este mensaje ingresa la clave:");
            if (pass === CONTRASEÑA_ADMIN) {
                db.ref(`chat_boda/${key}`).remove();
            } else if (pass !== null) {
                alert("Clave incorrecta.");
            }
        }
    </script>
</body>
</html>
