<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Víctor & Flor de Liz - Boda</title>
    
    <!-- Tipografías elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Librerías CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    
    <!-- SDK Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0b0c;
            color: #ffffff;
            text-align: left;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 16px 16px 100px 16px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .event-card-app {
            position: relative;
            height: 250px;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, rgba(11, 11, 12, 0.85) 100%), 
                        url('foto_pareja.jpg') center 30%/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 22px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            margin-bottom: 22px;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .badge-premium {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-premium::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 8px #d4af37;
        }

        .event-card-app h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.3rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.05;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .event-card-app p {
            font-size: 0.82rem;
            opacity: 0.95;
            font-weight: 400;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        .app-actions {
            display: flex;
            justify-content: space-around;
            padding: 8px;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            flex: 1;
            padding: 8px 0;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 18px;
        }

        .action-icon {
            width: 48px;
            height: 48px;
            background: #2c2c2e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid transparent;
        }

        .action-btn.active {
            color: #ffffff;
            font-weight: 600;
        }

        .action-btn.active .action-icon {
            background: #ffffff;
            color: #121212;
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.25);
        }

        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
            position: relative;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .photos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
            gap: 8px;
        }

        .photos-count {
            font-size: 0.82rem;
            color: #8e8e93;
            font-weight: 500;
        }

        .photos-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sort-select {
            background: #1c1c1e;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 8px 10px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            cursor: pointer;
        }

        .clear-btn {
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: #ff453a;
            padding: 8px 10px;
            border-radius: 14px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            background: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .photo-item img, .photo-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .time-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.68rem;
            font-weight: 600;
            color: #ffffff;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .like-btn {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 0.72rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 3;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .like-btn:active {
            transform: scale(0.9);
        }

        .timeline-item {
            display: flex;
            align-items: center;
            background: rgba(28, 28, 30, 0.75);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .timeline-time {
            font-size: 0.95rem;
            font-weight: 700;
            color: #d4af37;
            min-width: 85px;
        }

        /* ESTILOS DEL CHAT */
        .chat-container {
            background: rgba(22, 22, 24, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            height: 480px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chat-header {
            padding: 14px 18px;
            background: rgba(30, 30, 32, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .name-badge {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #d4af37;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-msg-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            max-width: 85%;
            position: relative;
        }

        .chat-msg-row.other {
            align-self: flex-start;
        }

        .chat-msg-row.me {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .chat-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4af37 0%, #8a6f22 100%);
            color: #121212;
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .chat-msg-row.me .chat-avatar {
            background: linear-gradient(135deg, #3a3a3c 0%, #1c1c1e 100%);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .chat-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.83rem;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
        }

        .chat-msg-row.other .chat-bubble {
            background: #2c2c2e;
            color: #f2f2f7;
            border-bottom-left-radius: 4px;
        }

        .chat-msg-row.me .chat-bubble {
            background: linear-gradient(135deg, #d4af37 0%, #b59129 100%);
            color: #0d0d0d;
            font-weight: 500;
            border-bottom-right-radius: 4px;
        }

        .chat-author {
            font-size: 0.68rem;
            font-weight: 700;
            margin-bottom: 3px;
            color: #d4af37;
            display: block;
        }

        .chat-msg-row.me .chat-author {
            color: #2a2003;
        }

        .chat-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            font-size: 0.62rem;
            margin-top: 4px;
            opacity: 0.75;
        }

        .delete-msg-icon {
            cursor: pointer;
            color: #ff453a;
            font-weight: bold;
            font-size: 0.75rem;
            padding: 0 2px;
        }

        .chat-input-area {
            padding: 12px 14px;
            background: rgba(28, 28, 30, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 12px 16px;
            border-radius: 20px;
            color: #ffffff;
            outline: none;
            font-size: 0.85rem;
            font-family: 'Montserrat', sans-serif;
        }

        .chat-send-btn {
            background: linear-gradient(135deg, #d4af37 0%, #aa892c 100%);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .chat-send-btn svg {
            width: 18px;
            height: 18px;
            fill: #121212;
        }

        .upload-btn-container {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        .upload-btn-main {
            pointer-events: auto;
            background: linear-gradient(135deg, #d9c58d 0%, #b39343 100%);
            color: #0d0d0d;
            border: none;
            padding: 16px 32px;
            border-radius: 35px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 10px 30px rgba(179, 147, 67, 0.4);
            cursor: pointer;
        }

        /* MODAL CARRUSEL */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox-modal.active { display: flex; }

        .lightbox-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-content {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 20px;
            object-fit: contain;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .nav-btn.prev { left: -10px; }
        .nav-btn.next { right: -10px; }

        .lightbox-actions {
            margin-top: 18px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .lightbox-delete-btn {
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.5);
            color: #ff453a;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .lightbox-close-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="event-card-app">
        <span class="badge-premium">Álbum Boda</span>
        <h3>Víctor & Flor de Liz</h3>
        <p>📍 Orizaba, Ver.</p>
    </div>

    <div class="app-actions">
        <button class="action-btn active" onclick="switchTab('fotos', this)">
            <div class="action-icon">🖼</div>
            Fotos
        </button>
        <button class="action-btn" onclick="switchTab('planning', this)">
            <div class="action-icon">📋</div>
            Planning
        </button>
        <button class="action-btn" onclick="switchTab('chat', this)">
            <div class="action-icon">💬</div>
            Chat
        </button>
    </div>

    <!-- PESTAÑA GALERÍA DE FOTOS -->
    <div id="tab-fotos" class="tab-content active">
        <div class="photos-header">
            <span class="photos-count" id="photos-count">0 archivos</span>
            <div class="photos-controls">
                <select class="sort-select" id="sort-select" onchange="renderGallery()">
                    <option value="newest">⚡ Recientes</option>
                    <option value="oldest">⏳ Antiguas</option>
                </select>
                <button class="clear-btn" onclick="borrarTodasLasFotos()">🗑️ Limpiar</button>
            </div>
        </div>
        <div class="photo-grid" id="gallery"></div>
    </div>

    <!-- PESTAÑA PLANNING -->
    <div id="tab-planning" class="tab-content">
        <div class="timeline-item">
            <div class="timeline-time">16:00 h</div>
            <div>
                <h4>Ceremonia Civil</h4>
                <p style="font-size: 0.8rem; opacity:0.7;">Jardín de las Orquídeas</p>
            </div>
        </div>
        <div class="timeline-item">
            <div class="timeline-time">18:00 h</div>
            <div>
                <h4>Recepción</h4>
                <p style="font-size: 0.8rem; opacity:0.7;">Jardín Central</p>
            </div>
        </div>
    </div>

    <!-- PESTAÑA CHAT -->
    <div id="tab-chat" class="tab-content">
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-user">
                    <span style="font-size: 0.8rem; color: #8e8e93;">Tu nombre:</span>
                    <button class="name-badge" id="current-user-badge" onclick="cambiarNombre()">Invitado ✏️</button>
                </div>
                <span style="font-size: 0.7rem; color: #34c759; display: flex; align-items: center; gap: 4px;">
                    <span style="width: 6px; height: 6px; background:#34c759; border-radius:50%;"></span> En vivo
                </span>
            </div>

            <div class="chat-messages" id="chat-messages"></div>

            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Escribe un mensaje para los novios..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="chat-send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="upload-btn-container">
        <button class="upload-btn-main" onclick="openCloudinaryWidget()">📸 Subir Foto o Video</button>
    </div>

    <!-- MODAL VISOR EN CARRUSEL -->
    <div class="lightbox-modal" id="lightbox">
        <div class="lightbox-container">
            <button class="nav-btn prev" onclick="navigateCarousel(-1)">❮</button>
            <div id="lightbox-body" style="display:flex; justify-content:center; width: 100%;"></div>
            <button class="nav-btn next" onclick="navigateCarousel(1)">❯</button>
        </div>
        <div class="lightbox-actions">
            <button class="lightbox-delete-btn" id="lightbox-delete-btn">🗑️ Eliminar</button>
            <button class="lightbox-close-btn" onclick="closeLightbox()">Cerrar</button>
        </div>
    </div>

    <script>
        const CONTRASEÑA_ADMIN = "1234";

        const firebaseConfig = {
            apiKey: "AIzaSyDUiIw6yisQ0u7Re06HPXroBIigiTr6Nvo",
            authDomain: "boda-victor-flor.firebaseapp.com",
            databaseURL: "https://boda-victor-flor-default-rtdb.firebaseio.com",
            projectId: "boda-victor-flor",
            storageBucket: "boda-victor-flor.firebasestorage.app",
            messagingSenderId: "461181016128",
            appId: "1:461181016128:web:36c3fa9307e1fc7d88e7a5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let myName = localStorage.getItem('chat_username') || '';
        if (!myName) {
            myName = 'Invitado ' + Math.floor(100 + Math.random() * 900);
            localStorage.setItem('chat_username', myName);
        }
        document.getElementById('current-user-badge').textContent = myName + ' ✏️';

        function cambiarNombre() {
            const nuevo = prompt("Introduce tu nombre:", myName);
            if (nuevo && nuevo.trim() !== '') {
                myName = nuevo.trim();
                localStorage.setItem('chat_username', myName);
                document.getElementById('current-user-badge').textContent = myName + ' ✏️';
            }
        }

        let galleryItems = [];
        let sortedItems = [];
        let currentIndex = 0;

        db.ref("galeria_boda").on("value", (snapshot) => {
            const data = snapshot.val();
            galleryItems = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    galleryItems.push({ id: key, ...data[key] });
                });
            }
            renderGallery();
        });

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const sortOrder = document.getElementById('sort-select').value;
            const countLabel = document.getElementById('photos-count');

            sortedItems = [...galleryItems].sort((a, b) => {
                return sortOrder === 'newest' ? b.timestamp - a.timestamp : a.timestamp - b.timestamp;
            });

            countLabel.textContent = `${sortedItems.length} archivos`;
            gallery.innerHTML = '';

            sortedItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'photo-item';

                const timeTag = `<span class="time-tag">⏱ ${item.timeStr || ''}</span>`;
                const likeBtn = `<div class="like-btn" onclick="toggleLike(event, '${item.id}')">❤️ ${item.likes || 0}</div>`;

                if (item.type === 'video') {
                    card.innerHTML = `${timeTag}<video src="${item.url}#t=0.5" preload="metadata"></video>${likeBtn}`;
                } else {
                    card.innerHTML = `${timeTag}<img src="${item.url}" loading="lazy">${likeBtn}`;
                }

                card.onclick = (e) => {
                    if (!e.target.closest('.like-btn')) openCarousel(index);
                };

                gallery.appendChild(card);
            });
        }

        function toggleLike(e, itemId) {
            e.stopPropagation();
            db.ref(`galeria_boda/${itemId}/likes`).transaction(current => (current || 0) + 1);
        }

        function openCloudinaryWidget() {
            cloudinary.openUploadWidget({
                cloudName: 'a1tokqak',
                uploadPreset: 'ml_default',
                sources: ['local', 'camera'],
                multiple: true
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    const now = new Date();
                    const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} h`;

                    db.ref("galeria_boda").push({
                        url: result.info.secure_url,
                        type: result.info.resource_type === 'video' ? 'video' : 'image',
                        timeStr: timeStr,
                        timestamp: Date.now(),
                        likes: 0
                    }).then(() => {
                        if (typeof confetti === 'function') confetti();
                    });
                }
            });
        }

        /* VISTA Y NAVEGACIÓN EN CARRUSEL */
        function openCarousel(index) {
            currentIndex = index;
            updateCarouselContent();
            document.getElementById('lightbox').classList.add('active');
        }

        function updateCarouselContent() {
            const body = document.getElementById('lightbox-body');
            const deleteBtn = document.getElementById('lightbox-delete-btn');
            const item = sortedItems[currentIndex];

            if (!item) return;

            body.innerHTML = item.type === 'video' 
                ? `<video src="${item.url}" controls autoplay class="lightbox-content"></video>`
                : `<img src="${item.url}" class="lightbox-content">`;

            deleteBtn.onclick = () => deletePhotoAdmin(item.id);
        }

        function navigateCarousel(direction) {
            if (sortedItems.length === 0) return;
            currentIndex = (currentIndex + direction + sortedItems.length) % sortedItems.length;
            updateCarouselContent();
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function deletePhotoAdmin(itemId) {
            const pass = prompt("Contraseña de administrador para borrar foto:");
            if (pass === CONTRASEÑA_ADMIN) {
                db.ref(`galeria_boda/${itemId}`).remove().then(() => {
                    closeLightbox();
                });
            } else if (pass !== null) {
                alert("Contraseña incorrecta");
            }
        }

        function borrarTodasLasFotos() {
            const pass = prompt("Contraseña de administrador para borrar TODA la galería:");
            if (pass === CONTRASEÑA_ADMIN) {
                db.ref("galeria_boda").remove();
            } else if (pass !== null) {
                alert("Contraseña incorrecta");
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        /* CHAT REALTIME Y ELIMINACIÓN COMO ADMIN */
        db.ref("chat_boda").on("value", (snapshot) => {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(k => {
                    const msg = data[k];
                    const isMe = msg.nombre === myName;
                    const initial = (msg.nombre || 'I').charAt(0);
                    
                    const dateObj = new Date(msg.timestamp || Date.now());
                    const timeStr = `${dateObj.getHours().toString().padStart(2, '0')}:${dateObj.getMinutes().toString().padStart(2, '0')}`;

                    const row = document.createElement('div');
                    row.className = `chat-msg-row ${isMe ? 'me' : 'other'}`;
                    
                    row.innerHTML = `
                        <div class="chat-avatar">${initial}</div>
                        <div class="chat-bubble">
                            <span class="chat-author">${isMe ? 'Tú' : msg.nombre}</span>
                            <div>${msg.texto}</div>
                            <div class="chat-meta">
                                <span>${timeStr}</span>
                                <span class="delete-msg-icon" onclick="deleteMessageAdmin('${k}')" title="Borrar mensaje">🗑️</span>
                            </div>
                        </div>
                    `;
                    
                    container.appendChild(row);
                });
                container.scrollTop = container.scrollHeight;
            }
        });

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const texto = input.value.trim();
            if (texto) {
                db.ref("chat_boda").push({
                    nombre: myName,
                    texto: texto,
                    timestamp: Date.now()
                });
                input.value = '';
            }
        }

        function deleteMessageAdmin(msgId) {
            const pass = prompt("Contraseña de administrador para eliminar mensaje:");
            if (pass === CONTRASEÑA_ADMIN) {
                db.ref(`chat_boda/${msgId}`).remove();
            } else if (pass !== null) {
                alert("Contraseña incorrecta");
            }
        }
    </script>
</body>
</html>
