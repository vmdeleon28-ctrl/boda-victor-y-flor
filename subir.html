<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Víctor & Flor de Liz - Experiencia Interactiva</title>
    
    <!-- Tipografías -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Librerías de Confeti, Cloudinary y Firebase SDK Compat -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0b0c;
            color: #ffffff;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 16px 16px 100px 16px;
            overflow-x: hidden;
        }
        .event-card-app {
            position: relative;
            height: 220px;
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(11,11,12,0.95) 100%), #1c1c1e;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 22px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .event-card-app h3 { font-family: 'Cormorant Garamond', serif; font-size: 2.3rem; }
        .app-actions {
            display: flex;
            justify-content: space-around;
            padding: 8px;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 22px;
        }
        .action-btn {
            background: none; border: none; color: #8e8e93; font-size: 0.75rem;
            cursor: pointer; font-family: 'Montserrat', sans-serif; flex: 1; padding: 8px 0;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .action-btn.active { color: #ffffff; font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .photo-item {
            position: relative; aspect-ratio: 1 / 1; border-radius: 18px;
            overflow: hidden; background: #1c1c1e; border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .photo-item img, .photo-item video { width: 100%; height: 100%; object-fit: cover; }
        .upload-btn-container {
            position: fixed; bottom: 24px; left: 0; right: 0;
            display: flex; justify-content: center; z-index: 1000;
        }
        .upload-btn-main {
            background: linear-gradient(135deg, #d9c58d 0%, #b39343 100%);
            color: #0d0d0d; border: none; padding: 16px 32px; border-radius: 35px;
            font-weight: 700; font-size: 0.9rem; cursor: pointer;
            box-shadow: 0 10px 30px rgba(179, 147, 67, 0.4);
        }
    </style>
</head>
<body>

    <div class="event-card-app">
        <h3>Víctor & Flor de Liz</h3>
        <p>📍 Orizaba, Ver.</p>
    </div>

    <div class="app-actions">
        <button class="action-btn active" onclick="switchTab('fotos', this)">🖼️ Fotos</button>
        <button class="action-btn" onclick="switchTab('chat', this)">💬 Chat</button>
    </div>

    <div id="tab-fotos" class="tab-content active">
        <div class="photo-grid" id="gallery"></div>
    </div>

    <div id="tab-chat" class="tab-content">
        <div id="chat-messages" style="height:250px; overflow-y:auto; margin-bottom:10px;"></div>
        <input type="text" id="msg-input" placeholder="Mensaje..." style="width:70%; padding:10px; border-radius:12px;">
        <button onclick="sendMessage()" style="padding:10px; border-radius:12px;">Enviar</button>
    </div>

    <div class="upload-btn-container">
        <button class="upload-btn-main" onclick="openCloudinaryWidget()">📸 Subir Foto o Video</button>
    </div>

    <script>
        // Configuración oficial de Firebase con tu API Key
        const firebaseConfig = {
            apiKey: "AIzaSyDUiIw6yisQ0u7Re06HPXroBIigiTr6Nvo",
            authDomain: "boda-victor-flor.firebaseapp.com",
            databaseURL: "https://boda-victor-flor-default-rtdb.firebaseio.com",
            projectId: "boda-victor-flor",
            storageBucket: "boda-victor-flor.firebasestorage.app",
            messagingSenderId: "461181016128",
            appId: "1:461181016128:web:36c3fa9307e1fc7d88e7a5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Escuchar Galería en tiempo real
        db.ref("galeria_boda").on("value", (snapshot) => {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(key => {
                    const item = data[key];
                    const div = document.createElement('div');
                    div.className = 'photo-item';
                    div.innerHTML = item.type === 'video' 
                        ? `<video src="${item.url}" controls></video>` 
                        : `<img src="${item.url}" loading="lazy">`;
                    gallery.appendChild(div);
                });
            }
        });

        // Widget de Cloudinary
        function openCloudinaryWidget() {
            cloudinary.openUploadWidget({
                cloudName: 'pheewujq',
                uploadPreset: 'ml_default',
                sources: ['local', 'camera'],
                multiple: true
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    db.ref("galeria_boda").push({
                        url: result.info.secure_url,
                        type: result.info.resource_type === 'video' ? 'video' : 'image',
                        timeStr: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                        timestamp: Date.now(),
                        likes: 0
                    });
                    if (typeof confetti === 'function') confetti();
                }
            });
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Chat
        db.ref("chat_boda").on("value", (snapshot) => {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(k => {
                    const p = document.createElement('p');
                    p.textContent = `${data[k].nombre}: ${data[k].texto}`;
                    container.appendChild(p);
                });
            }
        });

        function sendMessage() {
            const input = document.getElementById('msg-input');
            if (input.value.trim()) {
                db.ref("chat_boda").push({
                    nombre: "Invitado",
                    texto: input.value,
                    timestamp: Date.now()
                });
                input.value = '';
            }
        }
    </script>
</body>
</html>
